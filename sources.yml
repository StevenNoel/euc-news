# EUC News sources. Edit this file to add feeds, keyword searches, tags, or X accounts.
# type: rss    -> a normal RSS/Atom feed
# type: search -> a keyword news search (Google News RSS / Bing News RSS URL)
# type: msrc   -> MSRC CVRF API; keeps only Critical, exploited or publicly disclosed CVEs
# type: kev    -> CISA Known Exploited Vulnerabilities JSON, filtered by kev_vendors
# security: true -> items always show in the Security section
# outage: true -> items go to the Outages & status panel
# unreliable_dates: true -> feed stamps every item 'now'; ranked as older in Top Stories

feeds:
  # --- Vendor / product blogs ---
  - {name: Citrix Community Blogs, url: "https://community.citrix.com/rss/1-citrix-blogs.xml", type: rss, tags: [citrix]}
  - {name: Azure Virtual Desktop Blog, url: "https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureVirtualDesktopBlog", type: rss, tags: [avd, microsoft]}
  - {name: FSLogix Blog, url: "https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=FSLogix-Blog", type: rss, tags: [fslogix, microsoft]}
  - {name: Windows IT Pro Blog, url: "https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=Windows-ITPro-blog", type: rss, tags: [windows, microsoft]}
  - {name: Azure Local Blog, url: "https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=AzureStackBlog", type: rss, tags: [azure-local, microsoft]}
  - {name: Microsoft 365 Blog, url: "https://www.microsoft.com/en-us/microsoft-365/blog/feed/", type: rss, tags: [m365, microsoft]}
  - {name: Microsoft Learn - known issues, url: "https://learn.microsoft.com/api/search/rss?search=%22known+issues%22+Windows&locale=en-us", type: rss, tags: [windows, patch], unreliable_dates: true}
  - {name: VMware Blogs (Broadcom), url: "https://blogs.vmware.com/feed", type: rss, tags: [vmware]}
  - {name: ControlUp Blog, url: "https://www.controlup.com/feed/", type: rss, tags: [controlup]}
  - {name: IGEL Blog, url: "https://www.igel.com/feed/", type: rss, tags: [igel]}
  - {name: Nutanix Dev, url: "https://www.nutanix.dev/feed/", type: rss, tags: [nutanix]}
  - {name: Carl Stalhood, url: "https://www.carlstalhood.com/feed/", type: rss, tags: [citrix, community]}
  # --- Security lane ---
  - {name: CISA KEV, url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", type: kev, tags: [security, kev], security: true}
  - {name: MSRC (Critical / exploited / disclosed), url: "https://api.msrc.microsoft.com/cvrf/v3.0/updates", type: msrc, tags: [security, microsoft], security: true}
  - {name: BleepingComputer, url: "https://www.bleepingcomputer.com/feed/", type: rss, tags: [security], security: true, require_keywords: true}
  - {name: "Born's Tech and Windows World", url: "https://borncity.com/win/feed/", type: rss, tags: [windows, patch], require_keywords: true}
  - {name: The Register Security, url: "https://www.theregister.com/security/headlines.atom", type: rss, tags: [security], security: true, require_keywords: true}
  # --- Outages & Status (official status feeds; outage: true -> Outages strip) ---
  - {name: AWS Health, url: "https://status.aws.amazon.com/rss/all.rss", type: rss, tags: [outage, aws], outage: true, max_items: 30}
  - {name: Azure Status, url: "https://azure.status.microsoft/en-us/status/feed/", type: rss, tags: [outage, azure], outage: true}
  - {name: Google Cloud Status, url: "https://status.cloud.google.com/en/feed.atom", type: rss, tags: [outage, gcp], outage: true, max_items: 30}
  - {name: Cloudflare Status, url: "https://www.cloudflarestatus.com/history.atom", type: rss, tags: [outage, cloudflare], outage: true, max_items: 30}
  - {name: Microsoft 365 Status, url: "https://status.office365.com/api/feed/mac", type: rss, tags: [outage, m365], outage: true}
  - {name: "Google News: Cloud outages", url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=(AWS+OR+Azure+OR+%22Google+Cloud%22+OR+%22Microsoft+365%22+OR+%22Citrix+DaaS%22+OR+Cloudflare+OR+CrowdStrike)+outage", type: search, tags: [outage], outage: true}
  - {name: "Bing News: Cloud outages", url: "https://www.bing.com/news/search?format=rss&q=cloud+outage", type: search, tags: [outage], outage: true}
  - {name: "Bing News: Microsoft 365 outage", url: "https://www.bing.com/news/search?format=rss&q=Microsoft+365+outage", type: search, tags: [outage, m365], outage: true}
