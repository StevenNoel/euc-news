<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>EUC News – End-User Computing dashboard</title>
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="./"><span class="logo">EUC</span><span>News</span></a>
    <input id="q" type="search" placeholder="Search news…" aria-label="Search news" autocomplete="off">
    <select id="range" aria-label="Time range">
      <option value="1">24h</option><option value="3">3 days</option>
      <option value="7" selected>7 days</option><option value="30">30 days</option>
    </select>
    <button id="theme" class="icon" aria-label="Toggle dark/light theme" title="Toggle theme">◐</button>
  </div>
  <div class="bar sub">
    <nav id="chips" class="chips" aria-label="Vendor filters"></nav>
    <span id="updated" class="muted small">Loading…</span>
  </div>
</header>
<main id="grid" class="grid" aria-live="polite"></main>
<footer class="foot muted small">Headlines link to the original publishers · refreshed every 4 hours · <a href="https://github.com/StevenNoel/euc-news">source on GitHub</a></footer>
<script src="app.js"></script>
</body>
</html>
