<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>EUC News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap head">
    <h1>EUC News</h1>
    <span id="updated" class="muted">Loading…</span>
  </div>
  <div class="wrap controls">
    <input id="q" type="search" placeholder="Search titles, summaries, sources…" aria-label="Search">
    <select id="range" aria-label="Time range">
      <option value="1">Last 24h</option><option value="3">Last 3 days</option>
      <option value="7" selected>Last 7 days</option><option value="30">Last 30 days</option>
    </select>
    <label class="chk"><input type="checkbox" id="secOnly"> Security only</label>
  </div>
  <div class="wrap"><div id="tags" class="tags" role="group" aria-label="Tag filters"></div></div>
</header>
<main class="wrap">
  <section id="security" class="lane">
    <h2>🛡️ Security highlights</h2>
    <ol id="secList" class="list compact"></ol>
  </section>
  <section>
    <h2>Latest <span id="count" class="muted"></span></h2>
    <ol id="list" class="list"></ol>
    <button id="more" hidden>Show more</button>
  </section>
  <section id="community">
    <h2>X / Community</h2>
    <p class="muted">Curated EUC accounts (edit <code>x_accounts</code> in sources.yml).</p>
    <ul id="xList" class="xgrid"></ul>
  </section>
</main>
<footer class="wrap muted">Aggregated headlines link to original publishers. Updated every 4 hours via GitHub Actions. <a href="https://github.com/StevenNoel/euc-news">Source</a></footer>
<script src="app.js"></script>
</body>
</html>
