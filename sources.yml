# Vendors kept from the CISA KEV catalog (case-insensitive match on vendorProject/product)
kev_vendors: [citrix, netscaler, microsoft, vmware, broadcom, omnissa, nutanix, igel, controlup, unicon]

# Tag -> keywords. Any item whose title/summary contains a keyword gets the tag.
# Feeds with require_keywords: true only keep items that match at least one tag here.
tag_keywords:
  citrix: [citrix, cvad, "virtual apps and desktops", storefront, "citrix director", daas, xenserver]
  netscaler: [netscaler, "citrix adc", "citrix gateway"]
  xenserver: [xenserver]
  intune: [intune, "endpoint manager"]
  unicon: [unicon, elux]
  microsoft: [microsoft]
  fslogix: [fslogix]
  vmware: [vmware, "vmware horizon", vsphere, esxi]
  omnissa: [omnissa, "workspace one", "horizon 8"]
  m365: ["microsoft 365", "office 365", outlook, onedrive, "microsoft teams"]
  controlup: [controlup]
  igel: [igel]
  nutanix: [nutanix]
  avd: ["azure virtual desktop", " avd "]
  azure-local: ["azure local", "azure stack hci"]
  w365: ["windows 365", "cloud pc"]
  windows: ["windows 11", "windows server 2025", "windows server"]
  patch: ["patch tuesday", "known issue", "cumulative update", " kb50"]
  security: [cve-, vulnerability, exploit, zero-day, "0-day", ransomware, "security update", advisory]

# Curated EUC X accounts shown in "X / Community" (profile links, no API needed).
