# Vendors kept from the CISA KEV catalog (case-insensitive match on vendorProject/product)
kev_vendors: [citrix, netscaler, microsoft, vmware, broadcom, omnissa, nutanix, igel, controlup, unicon]

# Tag -> keywords. Any item whose title/summary contains a keyword gets the tag.
# Feeds with require_keywords: true only keep items that match at least one tag here.
