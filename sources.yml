  fslogix: [fslogix]
  vmware: [vmware, "vmware horizon", vsphere, esxi]
  omnissa: [omnissa, "workspace one", "horizon 8"]
  m365: ["microsoft 365", "office 365", outlook, onedrive, "microsoft teams"]
  controlup: [controlup]
  igel: [igel]
  nutanix: [nutanix]
  avd: ["azure virtual desktop", " avd "]
  azure-local: ["azure local", "azure stack hci"]
  w365: ["windows 365", "cloud pc"]
  windows: ["windows 11", "windows server 2025", "windows server"]
  patch: ["patch tuesday", "known issue", "cumulative update", " kb50"]
  ai: ["artificial intelligence", " llm", "large language model", "generative ai", "genai"]
